name: Claude Review

on:
    pull_request:
        types: [opened, ready_for_review]
        branches: [main]

concurrency:
    group: claude-review-${{ github.event.pull_request.number }}
    cancel-in-progress: true

jobs:
    review:
        if: github.event.pull_request.draft == false && github.event.pull_request.head.repo.full_name == github.repository && vars.CLAUDE_REVIEW_ENABLED == 'true'
        runs-on: ubuntu-latest
        timeout-minutes: 30
        permissions:
            contents: read
            pull-requests: write
            issues: read
            id-token: write
            actions: read
        steps:
            - uses: actions/checkout@v4
              with:
                  fetch-depth: 0

            - uses: anthropics/claude-code-action@v1
              with:
                  claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
                  prompt: |
                      Revise o PR ${{ github.event.pull_request.number }} deste repositório: bugs, regressões, fronteiras de camada violadas, comentários no código, strings soltas na interface e cor fixa fora dos tokens. Responda em pt-BR com um único comentário no PR.
                  claude_args: |
                      --max-turns 40
                      --allowedTools "Read,Grep,Glob,Bash(git diff:*),Bash(git log:*),Bash(gh pr view:*),Bash(gh pr diff:*),Bash(gh pr comment:*),Bash(gh issue view:*)"
