name: deploy dev

on:
  workflow_dispatch:

concurrency:
  group: deploy-dev
  cancel-in-progress: true

permissions:
  contents: read

env:
  PAGES_PROJECT: vera-app-dev

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      VERA_DOMAIN: ${{ vars.VERA_DOMAIN }}
    steps:
      - name: Gate
        id: gate
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ] || [ -z "$VERA_DOMAIN" ]; then
            echo "::notice::Deploy skipped: CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID or VERA_DOMAIN is not configured."
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "enabled=true" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        if: steps.gate.outputs.enabled == 'true'

      - uses: actions/setup-node@v4
        if: steps.gate.outputs.enabled == 'true'
        with:
          node-version: 22
          cache: npm

      - run: npm ci
        if: steps.gate.outputs.enabled == 'true'

      - run: npm run lint
        if: steps.gate.outputs.enabled == 'true'

      - run: npm run typecheck
        if: steps.gate.outputs.enabled == 'true'

      - run: npm test
        if: steps.gate.outputs.enabled == 'true'

      - run: npm run build
        if: steps.gate.outputs.enabled == 'true'
        env:
          VITE_API_URL: https://api-dev.${{ vars.VERA_DOMAIN }}
          VITE_POSTHOG_KEY: ${{ vars.POSTHOG_KEY }}

      - uses: cloudflare/wrangler-action@v3
        if: steps.gate.outputs.enabled == 'true'
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=${{ env.PAGES_PROJECT }} --branch=main

      - name: Smoke
        if: steps.gate.outputs.enabled == 'true'
        run: |
          curl --fail --silent --show-error --retry 5 --retry-delay 5 --retry-all-errors -o /dev/null https://app-dev.${{ vars.VERA_DOMAIN }}/
          curl --fail --silent --show-error --retry 5 --retry-delay 5 --retry-all-errors -o /dev/null https://app-dev.${{ vars.VERA_DOMAIN }}/route-that-does-not-exist
